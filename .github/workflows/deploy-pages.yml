name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create dashboard directory
        run: |
          mkdir -p _site/dashboard
          mkdir -p _site/api
          mkdir -p _site/examples

      - name: Copy main files
        run: |
          cp index.html _site/
          cp -r sat_chat/examples/marine_monitoring_dashboard.html _site/dashboard/index.html
          
      - name: Create API documentation
        run: |
          cat > _site/api/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>SatChat API 문서</title>
              <script src="https://cdn.tailwindcss.com"></script>
          </head>
          <body class="bg-gray-100">
              <div class="max-w-4xl mx-auto p-6">
                  <h1 class="text-3xl font-bold mb-6">📡 SatChat API 문서</h1>
                  
                  <div class="bg-white rounded-lg shadow p-6 mb-6">
                      <h2 class="text-xl font-semibold mb-4">API 엔드포인트</h2>
                      
                      <div class="space-y-4">
                          <div class="border-l-4 border-blue-500 pl-4">
                              <h3 class="font-semibold">GET /api/v1/statistics</h3>
                              <p class="text-gray-600">시스템 통계 정보 조회</p>
                          </div>
                          
                          <div class="border-l-4 border-green-500 pl-4">
                              <h3 class="font-semibold">GET /api/v1/detections</h3>
                              <p class="text-gray-600">탐지 결과 목록 조회</p>
                          </div>
                          
                          <div class="border-l-4 border-yellow-500 pl-4">
                              <h3 class="font-semibold">GET /api/v1/alerts</h3>
                              <p class="text-gray-600">알림 목록 조회</p>
                          </div>
                          
                          <div class="border-l-4 border-purple-500 pl-4">
                              <h3 class="font-semibold">POST /api/v1/monitoring/regions/{region_name}</h3>
                              <p class="text-gray-600">특정 지역 모니터링 실행</p>
                          </div>
                      </div>
                  </div>
                  
                  <div class="bg-white rounded-lg shadow p-6">
                      <h2 class="text-xl font-semibold mb-4">시작하기</h2>
                      <pre class="bg-gray-100 p-4 rounded"><code># 로컬 서버 실행
          python -m uvicorn src.satchat.main:app --reload --host 0.0.0.0 --port 8000

          # 또는 Docker로 실행
          docker-compose up</code></pre>
                  </div>
                  
                  <div class="mt-6 text-center">
                      <a href="../" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">← 대시보드로 돌아가기</a>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Create examples page
        run: |
          cat > _site/examples/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>SatChat 예제</title>
              <script src="https://cdn.tailwindcss.com"></script>
          </head>
          <body class="bg-gray-100">
              <div class="max-w-6xl mx-auto p-6">
                  <h1 class="text-3xl font-bold mb-6">🔬 SatChat 예제 및 데모</h1>
                  
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div class="bg-white rounded-lg shadow p-6">
                          <h3 class="text-xl font-semibold mb-3">🌊 해양 폐기물 탐지</h3>
                          <p class="text-gray-600 mb-4">FDI 기반 실시간 해양 폐기물 탐지 시스템</p>
                          <div class="bg-gray-100 p-3 rounded text-sm mb-4">
                              <code>python sat_chat/examples/marine_debris_detector.py</code>
                          </div>
                          <div class="text-sm text-gray-500">
                              <p>✅ FDI 계산: 부유 쓰레기 의심 영역 19.10%</p>
                              <p>✅ 플라스틱 쓰레기: 9.3%</p>
                              <p>✅ 해조류: 4.0%</p>
                          </div>
                      </div>
                      
                      <div class="bg-white rounded-lg shadow p-6">
                          <h3 class="text-xl font-semibold mb-3">🛰️ 토지 피복 분류</h3>
                          <p class="text-gray-600 mb-4">NDVI/NDWI 기반 토지 피복 분류 시스템</p>
                          <div class="bg-gray-100 p-3 rounded text-sm mb-4">
                              <code>python sat_chat/examples/eo_learn_classification.py</code>
                          </div>
                          <div class="text-sm text-gray-500">
                              <p>✅ 물: 50%, 식생: 18%</p>
                              <p>✅ 도시: 23%, 나지: 9%</p>
                          </div>
                      </div>
                      
                      <div class="bg-white rounded-lg shadow p-6">
                          <h3 class="text-xl font-semibold mb-3">📊 eo-learn 워크플로우</h3>
                          <p class="text-gray-600 mb-4">위성 데이터 처리 파이프라인</p>
                          <div class="bg-gray-100 p-3 rounded text-sm mb-4">
                              <code>python sat_chat/examples/eo_learn_lite.py</code>
                          </div>
                          <div class="text-sm text-gray-500">
                              <p>✅ EOPatch 데이터 구조</p>
                              <p>✅ EOTask 처리 체인</p>
                              <p>✅ EOWorkflow 자동화</p>
                          </div>
                      </div>
                      
                      <div class="bg-white rounded-lg shadow p-6">
                          <h3 class="text-xl font-semibold mb-3">🌍 실제 Sentinel 데이터</h3>
                          <p class="text-gray-600 mb-4">Copernicus 위성 데이터 연동</p>
                          <div class="bg-gray-100 p-3 rounded text-sm mb-4">
                              <code>python test_real_sentinel.py</code>
                          </div>
                          <div class="text-sm text-gray-500">
                              <p>✅ Sentinel Hub API 연동</p>
                              <p>✅ 실시간 데이터 처리</p>
                          </div>
                      </div>
                  </div>
                  
                  <div class="mt-8 bg-blue-50 border border-blue-200 rounded-lg p-6">
                      <h3 class="text-lg font-semibold mb-3">🚀 빠른 시작</h3>
                      <div class="space-y-2">
                          <p><code class="bg-gray-100 px-2 py-1 rounded">git clone https://github.com/djyalu/sat_chat.git</code></p>
                          <p><code class="bg-gray-100 px-2 py-1 rounded">cd sat_chat && pip install -r requirements.txt</code></p>
                          <p><code class="bg-gray-100 px-2 py-1 rounded">python sat_chat/examples/marine_debris_detector.py</code></p>
                      </div>
                  </div>
                  
                  <div class="mt-6 text-center">
                      <a href="../" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">← 메인으로 돌아가기</a>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4