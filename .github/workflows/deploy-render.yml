name: Auto Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Log deployment start
      run: |
        echo "🚀 자동 배포 시작"
        echo "📦 커밋: ${{ github.sha }}"
        echo "👤 작성자: ${{ github.actor }}"
        echo "📝 메시지: ${{ github.event.head_commit.message }}"
    
    # Render는 GitHub 통합으로 자동 배포됨
    # 추가 API 호출은 필요 없음
    
    - name: Wait for Render deployment
      run: |
        echo "⏳ Render 자동 배포 대기 중..."
        echo "Render가 GitHub 웹훅을 통해 자동으로 배포합니다."
        sleep 30
        
    - name: Monitor deployment
      run: |
        for i in {1..10}; do
          echo "체크 $i/10..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://sat-chat-api.onrender.com/health || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ 배포 성공!"
            echo "🌐 서비스 URL:"
            echo "  - API: https://sat-chat-api.onrender.com"
            echo "  - Web: https://sat-chat.onrender.com"
            exit 0
          fi
          echo "상태 코드: $response - 대기 중..."
          sleep 30
        done
        echo "⚠️ 배포 확인 시간 초과 (5분)"
        echo "Render 대시보드에서 직접 확인하세요."