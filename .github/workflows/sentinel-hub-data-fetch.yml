name: Sentinel Hub Marine Debris Detection

on:
  schedule:
    # 매 6시간마다 실행 (UTC 기준)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      region:
        description: 'Region to monitor (all, west_sea, south_sea, east_sea)'
        required: false
        default: 'all'
      priority_only:
        description: 'Process priority zones only'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.9'
  
jobs:
  fetch-satellite-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 📦 Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: 📚 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sentinelhub-py requests numpy pandas fastapi uvicorn
        pip install aiofiles shapely geopandas
    
    - name: 🛰️ Fetch Sentinel Hub Data
      env:
        SENTINEL_CLIENT_ID: ${{ secrets.SENTINEL_CLIENT_ID }}
        SENTINEL_CLIENT_SECRET: ${{ secrets.SENTINEL_CLIENT_SECRET }}
        REGION: ${{ github.event.inputs.region || 'all' }}
        PRIORITY_ONLY: ${{ github.event.inputs.priority_only || 'false' }}
      run: |
        python scripts/fetch_sentinel_data.py \
          --region $REGION \
          --priority-only $PRIORITY_ONLY
    
    - name: 📊 Process Detection Data
      run: |
        python scripts/process_detections.py
    
    - name: 📈 Generate Statistics
      run: |
        python scripts/generate_statistics.py
    
    - name: 💾 Upload Detection Results
      uses: actions/upload-artifact@v3
      with:
        name: detection-results-${{ github.run_number }}
        path: |
          data/detections/*.json
          data/statistics/*.json
          data/alerts/*.json
        retention-days: 30
    
    - name: 🔄 Update Database
      if: success()
      run: |
        python scripts/update_database.py
    
    - name: 📢 Send Alerts
      if: success()
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      run: |
        python scripts/send_alerts.py
    
    - name: 📝 Commit Data Updates
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        git diff --quiet && git diff --staged --quiet || \
          git commit -m "🛰️ Update marine debris detection data [skip ci]
          
          Region: ${{ env.REGION }}
          Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Run: #${{ github.run_number }}"
        git push

  generate-report:
    needs: fetch-satellite-data
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v3
    
    - name: 📦 Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: detection-results-${{ github.run_number }}
        path: data/
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 📊 Generate Report
      run: |
        python scripts/generate_report.py \
          --run-number ${{ github.run_number }} \
          --output reports/detection-report-$(date +%Y%m%d).md
    
    - name: 📈 Update Dashboard Data
      run: |
        python scripts/update_dashboard.py
    
    - name: 🌐 Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      run: |
        python scripts/generate_static_site.py
        # GitHub Pages will automatically deploy from gh-pages branch

  notify-critical:
    needs: fetch-satellite-data
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
    - name: 🚨 Send Failure Notification
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        curl -H "Content-Type: application/json" \
          -d "{\"content\": \"⚠️ Sentinel Hub data fetch failed! Check workflow run #${{ github.run_number }}\"}" \
          $DISCORD_WEBHOOK