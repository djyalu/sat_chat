<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛰️ SatChat - 해양 폐기물 모니터링 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #map { height: 500px; }
        .leaflet-container { background: #1e293b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        // GitHub Pages에서는 API 서버가 없으므로 데모 데이터 사용
        const API_URL = 'demo'; // Demo mode for GitHub Pages

        // API Service with demo data for GitHub Pages
        const api = {
            get: async (endpoint) => {
                // Demo data for GitHub Pages
                if (API_URL === 'demo') {
                    await new Promise(resolve => setTimeout(resolve, 500)); // Simulate API delay
                    
                    if (endpoint === '/api/v1/statistics') {
                        return {
                            total_detections: 1247,
                            active_alerts: 3,
                            monitored_area: 2450,
                            detection_rate: 94.2
                        };
                    }
                    
                    if (endpoint === '/api/v1/detections') {
                        return [
                            {
                                id: 1,
                                debris_type: '플라스틱',
                                latitude: 35.1796,
                                longitude: 129.0756,
                                confidence: 0.95,
                                detection_time: '2분 전'
                            },
                            {
                                id: 2,
                                debris_type: '어망',
                                latitude: 33.5563,
                                longitude: 126.7958,
                                confidence: 0.87,
                                detection_time: '15분 전'
                            },
                            {
                                id: 3,
                                debris_type: '부표',
                                latitude: 37.4563,
                                longitude: 124.7958,
                                confidence: 0.78,
                                detection_time: '1시간 전'
                            }
                        ];
                    }
                    
                    if (endpoint === '/api/v1/alerts') {
                        return [
                            {
                                id: 1,
                                title: '긴급 알림',
                                message: '부산항 인근에서 대량 플라스틱 폐기물 탐지됨 (95.2% 확신도)',
                                priority: 'high',
                                created_at: '2분 전'
                            },
                            {
                                id: 2,
                                title: '주의 알림',
                                message: '제주 남쪽 해역에서 어망 폐기물 확인 필요',
                                priority: 'medium',
                                created_at: '15분 전'
                            }
                        ];
                    }
                    
                    return null;
                }
                
                // Real API call for local development
                try {
                    const response = await fetch(API_URL + endpoint);
                    return await response.json();
                } catch (error) {
                    console.error('API Error:', error);
                    return null;
                }
            }
        };

        // Stats Card Component
        const StatCard = ({ title, value, unit, icon, color }) => (
            <div className="bg-white rounded-lg shadow p-6">
                <div className="flex items-center justify-between">
                    <div>
                        <p className="text-gray-600 text-sm">{title}</p>
                        <p className="text-2xl font-bold text-gray-900">
                            {value}
                            {unit && <span className="text-lg text-gray-500 ml-1">{unit}</span>}
                        </p>
                    </div>
                    <div className={`p-3 rounded-full ${color}`}>
                        <span className="text-2xl">{icon}</span>
                    </div>
                </div>
            </div>
        );

        // Navigation Component
        const Navigation = ({ activeTab, setActiveTab }) => {
            const tabs = [
                { id: 'dashboard', name: '대시보드', icon: '📊' },
                { id: 'monitoring', name: '실시간 모니터링', icon: '🗺️' },
                { id: 'analysis', name: '분석', icon: '📈' },
                { id: 'alerts', name: '알림', icon: '🔔' }
            ];

            return (
                <nav className="bg-blue-600 text-white shadow-lg">
                    <div className="max-w-7xl mx-auto px-4">
                        <div className="flex items-center justify-between h-16">
                            <div className="flex items-center">
                                <span className="text-2xl mr-3">🛰️</span>
                                <h1 className="text-xl font-bold">SatChat</h1>
                                <span className="ml-3 text-sm opacity-90">해양 폐기물 모니터링</span>
                            </div>
                            <div className="flex space-x-4">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-4 py-2 rounded transition ${
                                            activeTab === tab.id 
                                                ? 'bg-blue-700' 
                                                : 'hover:bg-blue-500'
                                        }`}
                                    >
                                        <span className="mr-2">{tab.icon}</span>
                                        {tab.name}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </nav>
            );
        };

        // Dashboard Component
        const Dashboard = () => {
            const [stats, setStats] = useState(null);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                api.get('/api/v1/statistics').then(setStats);
            }, []);

            useEffect(() => {
                if (!stats || !chartRef.current) return;

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['1월', '2월', '3월', '4월', '5월', '6월'],
                        datasets: [{
                            label: '탐지 건수',
                            data: [12, 19, 23, 25, 22, 30],
                            borderColor: 'rgb(59, 130, 246)',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [stats]);

            if (!stats) return <div className="p-8 text-center">로딩 중...</div>;

            return (
                <div className="p-6">
                    <h2 className="text-2xl font-bold mb-6">대시보드</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <StatCard
                            title="총 탐지 건수"
                            value={stats.total_detections}
                            unit="건"
                            icon="🎯"
                            color="bg-blue-100"
                        />
                        <StatCard
                            title="활성 알림"
                            value={stats.active_alerts}
                            unit="개"
                            icon="🔔"
                            color="bg-red-100"
                        />
                        <StatCard
                            title="모니터링 면적"
                            value={stats.monitored_area?.toLocaleString()}
                            unit="km²"
                            icon="🌊"
                            color="bg-green-100"
                        />
                        <StatCard
                            title="탐지 정확도"
                            value={stats.detection_rate}
                            unit="%"
                            icon="📊"
                            color="bg-purple-100"
                        />
                    </div>

                    <div className="bg-white rounded-lg shadow p-6">
                        <h3 className="text-lg font-semibold mb-4">월별 탐지 추이</h3>
                        <div style={{ height: '300px' }}>
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>
                </div>
            );
        };

        // Monitoring Component
        const Monitoring = () => {
            const [detections, setDetections] = useState([]);
            const mapRef = useRef(null);
            const mapInstance = useRef(null);

            useEffect(() => {
                api.get('/api/v1/detections').then(setDetections);
            }, []);

            useEffect(() => {
                if (!mapRef.current || mapInstance.current) return;

                // Initialize map
                const map = L.map(mapRef.current).setView([36.5, 127.5], 7);
                mapInstance.current = map;

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);

                // Add detection markers
                if (detections && detections.length > 0) {
                    detections.forEach(detection => {
                        const icon = L.divIcon({
                            html: `<div style="background: ${
                                detection.confidence > 0.9 ? '#ef4444' : '#f59e0b'
                            }; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                                ${detection.type === '플라스틱' ? 'P' : detection.type === '어망' ? 'N' : 'B'}
                            </div>`,
                            iconSize: [30, 30],
                            className: 'custom-div-icon'
                        });

                        L.marker([detection.latitude, detection.longitude], { icon })
                            .addTo(map)
                            .bindPopup(`
                                <strong>${detection.debris_type}</strong><br>
                                신뢰도: ${(detection.confidence * 100).toFixed(1)}%<br>
                                시간: ${detection.detection_time}
                            `);
                    });
                }

                return () => {
                    if (mapInstance.current) {
                        mapInstance.current.remove();
                        mapInstance.current = null;
                    }
                };
            }, [detections]);

            return (
                <div className="p-6">
                    <h2 className="text-2xl font-bold mb-6">실시간 모니터링</h2>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2">
                            <div className="bg-white rounded-lg shadow p-4">
                                <h3 className="text-lg font-semibold mb-3">탐지 지도</h3>
                                <div ref={mapRef} id="map" className="rounded"></div>
                            </div>
                        </div>
                        
                        <div>
                            <div className="bg-white rounded-lg shadow p-4">
                                <h3 className="text-lg font-semibold mb-3">최근 탐지</h3>
                                <div className="space-y-3 max-h-96 overflow-y-auto">
                                    {detections && detections.map(detection => (
                                        <div key={detection.id} className="border-l-4 border-blue-500 pl-3 py-2">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <p className="font-semibold">{detection.debris_type}</p>
                                                    <p className="text-sm text-gray-600">
                                                        위치: {detection.latitude?.toFixed(2)}°N, {detection.longitude?.toFixed(2)}°E
                                                    </p>
                                                    <p className="text-sm text-gray-500">{detection.detection_time}</p>
                                                </div>
                                                <span className={`px-2 py-1 text-xs rounded ${
                                                    detection.confidence > 0.9 
                                                        ? 'bg-red-100 text-red-800' 
                                                        : 'bg-yellow-100 text-yellow-800'
                                                }`}>
                                                    {(detection.confidence * 100).toFixed(0)}%
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Analysis Component
        const Analysis = () => {
            const [statistics, setStatistics] = useState(null);

            useEffect(() => {
                api.get('/api/v1/statistics').then(setStatistics);
            }, []);

            return (
                <div className="p-6">
                    <h2 className="text-2xl font-bold mb-6">데이터 분석</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-lg shadow p-6">
                            <h3 className="text-lg font-semibold mb-4">폐기물 유형별 분포</h3>
                            <div className="space-y-3">
                                <div className="flex items-center justify-between">
                                    <span>플라스틱</span>
                                    <div className="flex items-center">
                                        <div className="w-32 bg-gray-200 rounded-full h-2 mr-3">
                                            <div className="bg-blue-600 h-2 rounded-full" style={{width: '45%'}}></div>
                                        </div>
                                        <span className="text-sm">45%</span>
                                    </div>
                                </div>
                                <div className="flex items-center justify-between">
                                    <span>어망</span>
                                    <div className="flex items-center">
                                        <div className="w-32 bg-gray-200 rounded-full h-2 mr-3">
                                            <div className="bg-green-600 h-2 rounded-full" style={{width: '30%'}}></div>
                                        </div>
                                        <span className="text-sm">30%</span>
                                    </div>
                                </div>
                                <div className="flex items-center justify-between">
                                    <span>부표</span>
                                    <div className="flex items-center">
                                        <div className="w-32 bg-gray-200 rounded-full h-2 mr-3">
                                            <div className="bg-yellow-600 h-2 rounded-full" style={{width: '25%'}}></div>
                                        </div>
                                        <span className="text-sm">25%</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-lg shadow p-6">
                            <h3 className="text-lg font-semibold mb-4">지역별 탐지 현황</h3>
                            <div className="space-y-3">
                                <div className="flex justify-between items-center p-3 bg-gray-50 rounded">
                                    <span className="font-medium">서해</span>
                                    <span className="text-2xl font-bold text-blue-600">47</span>
                                </div>
                                <div className="flex justify-between items-center p-3 bg-gray-50 rounded">
                                    <span className="font-medium">남해</span>
                                    <span className="text-2xl font-bold text-green-600">62</span>
                                </div>
                                <div className="flex justify-between items-center p-3 bg-gray-50 rounded">
                                    <span className="font-medium">동해</span>
                                    <span className="text-2xl font-bold text-purple-600">33</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Alerts Component
        const Alerts = () => {
            const [alerts, setAlerts] = useState([]);

            useEffect(() => {
                api.get('/api/v1/alerts').then(setAlerts);
            }, []);

            return (
                <div className="p-6">
                    <h2 className="text-2xl font-bold mb-6">알림 센터</h2>
                    
                    <div className="space-y-4">
                        {alerts && alerts.map(alert => (
                            <div key={alert.id} className={`border-l-4 ${
                                alert.priority === 'high' ? 'border-red-500 bg-red-50' :
                                alert.priority === 'medium' ? 'border-yellow-500 bg-yellow-50' :
                                'border-blue-500 bg-blue-50'
                            } p-4 rounded-r`}>
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h3 className="font-semibold text-lg">{alert.title}</h3>
                                        <p className="text-gray-700 mt-1">{alert.message}</p>
                                        <p className="text-sm text-gray-500 mt-2">{alert.created_at}</p>
                                    </div>
                                    <span className={`px-3 py-1 rounded text-sm font-medium ${
                                        alert.priority === 'high' ? 'bg-red-200 text-red-800' :
                                        alert.priority === 'medium' ? 'bg-yellow-200 text-yellow-800' :
                                        'bg-blue-200 text-blue-800'
                                    }`}>
                                        {alert.priority === 'high' ? '긴급' :
                                         alert.priority === 'medium' ? '주의' : '정보'}
                                    </span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [serverStatus, setServerStatus] = useState('checking');

            useEffect(() => {
                // Check server status
                if (API_URL === 'demo') {
                    setServerStatus('demo');
                } else {
                    fetch(API_URL + '/')
                        .then(res => res.ok ? setServerStatus('online') : setServerStatus('offline'))
                        .catch(() => setServerStatus('offline'));
                }
            }, []);

            return (
                <div className="min-h-screen bg-gray-100">
                    <Navigation activeTab={activeTab} setActiveTab={setActiveTab} />
                    
                    {/* Server Status Bar */}
                    <div className={`px-4 py-2 text-center text-sm ${
                        serverStatus === 'online' ? 'bg-green-500 text-white' :
                        serverStatus === 'demo' ? 'bg-blue-500 text-white' :
                        serverStatus === 'offline' ? 'bg-red-500 text-white' :
                        'bg-yellow-500 text-white'
                    }`}>
                        {serverStatus === 'online' ? '✅ 서버 연결됨' :
                         serverStatus === 'demo' ? '🌐 데모 모드 (GitHub Pages)' :
                         serverStatus === 'offline' ? '❌ 서버 오프라인' :
                         '⏳ 서버 확인 중...'}
                    </div>
                    
                    <div className="max-w-7xl mx-auto">
                        {activeTab === 'dashboard' && <Dashboard />}
                        {activeTab === 'monitoring' && <Monitoring />}
                        {activeTab === 'analysis' && <Analysis />}
                        {activeTab === 'alerts' && <Alerts />}
                    </div>
                </div>
            );
        };

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
