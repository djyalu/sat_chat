<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛰️ SatChat - 실시간 Sentinel-2 모니터링 (간단버전)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading { 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-4">
        <!-- 헤더 -->
        <header class="bg-gray-800 rounded-lg p-4 mb-6">
            <h1 class="text-3xl font-bold">🛰️ SatChat Sentinel-2 실시간 모니터링</h1>
            <p class="text-gray-400 mt-2">한국 해역 해양 플라스틱 탐지 시스템</p>
        </header>

        <!-- 지역 선택 버튼 -->
        <div class="flex gap-2 mb-6">
            <button onclick="loadRegion('west_sea')" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg transition">
                🌊 서해
            </button>
            <button onclick="loadRegion('south_sea')" class="px-6 py-3 bg-green-600 hover:bg-green-700 rounded-lg transition">
                🌊 남해
            </button>
            <button onclick="loadRegion('east_sea')" class="px-6 py-3 bg-purple-600 hover:bg-purple-700 rounded-lg transition">
                🌊 동해
            </button>
        </div>

        <!-- 상태 표시 -->
        <div id="status" class="bg-gray-800 rounded-lg p-4 mb-6">
            <p>지역을 선택하세요...</p>
        </div>

        <!-- 메인 콘텐츠 그리드 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 위성 이미지 -->
            <div class="bg-gray-800 rounded-lg p-4">
                <h2 class="text-xl font-bold mb-4">📸 위성 이미지</h2>
                <div id="imageContainer" class="bg-gray-700 rounded p-4 min-h-[400px] flex items-center justify-center">
                    <p class="text-gray-400">이미지 로딩 대기중...</p>
                </div>
            </div>

            <!-- 히트맵 -->
            <div class="bg-gray-800 rounded-lg p-4">
                <h2 class="text-xl font-bold mb-4">🔥 오염 히트맵</h2>
                <div id="heatmapContainer" class="bg-gray-700 rounded p-4 min-h-[400px] flex items-center justify-center">
                    <p class="text-gray-400">히트맵 로딩 대기중...</p>
                </div>
            </div>
        </div>

        <!-- 통계 정보 -->
        <div class="grid grid-cols-4 gap-4 mt-6">
            <div class="bg-gray-800 rounded-lg p-4">
                <p class="text-gray-400 text-sm">오염도</p>
                <p id="plasticPercentage" class="text-2xl font-bold">-</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-4">
                <p class="text-gray-400 text-sm">오염 면적</p>
                <p id="plasticArea" class="text-2xl font-bold">-</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-4">
                <p class="text-gray-400 text-sm">신뢰도</p>
                <p id="confidence" class="text-2xl font-bold">-</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-4">
                <p class="text-gray-400 text-sm">핫스팟</p>
                <p id="hotspots" class="text-2xl font-bold">-</p>
            </div>
        </div>

        <!-- 알림 -->
        <div id="alerts" class="mt-6 bg-gray-800 rounded-lg p-4">
            <h3 class="text-lg font-bold mb-2">🚨 알림</h3>
            <div id="alertsList" class="space-y-2">
                <p class="text-gray-400">알림 대기중...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8001';
        let currentRegion = null;

        async function loadRegion(region) {
            currentRegion = region;
            const regionNames = {
                'west_sea': '서해',
                'south_sea': '남해',
                'east_sea': '동해'
            };

            // 상태 업데이트
            document.getElementById('status').innerHTML = `
                <div class="flex items-center">
                    <div class="loading w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full mr-3"></div>
                    <span>${regionNames[region]} 데이터 로딩중...</span>
                </div>
            `;

            try {
                // API 호출
                console.log(`Fetching data for ${region}...`);
                const response = await fetch(`${API_URL}/region/${region}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('Received data:', data);

                // 상태 업데이트
                document.getElementById('status').innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="text-green-400">✅ ${regionNames[region]} 데이터 수신 완료</span>
                            <span class="text-gray-400 text-sm ml-4">업데이트: ${new Date().toLocaleTimeString()}</span>
                        </div>
                    </div>
                `;

                // 이미지 표시
                if (data.image_rgb) {
                    document.getElementById('imageContainer').innerHTML = `
                        <img src="data:image/png;base64,${data.image_rgb}" 
                             alt="Satellite Image" 
                             class="w-full h-auto rounded"
                             onload="console.log('Image loaded successfully')"
                             onerror="console.error('Image load failed')">
                    `;
                } else {
                    document.getElementById('imageContainer').innerHTML = `
                        <p class="text-yellow-400">이미지 데이터 없음</p>
                    `;
                }

                // 히트맵 표시
                if (data.heatmap) {
                    document.getElementById('heatmapContainer').innerHTML = `
                        <img src="data:image/png;base64,${data.heatmap}" 
                             alt="Heatmap" 
                             class="w-full h-auto rounded">
                    `;
                }

                // 통계 업데이트
                document.getElementById('plasticPercentage').textContent = 
                    `${(data.plastic_percentage * 100).toFixed(2)}%`;
                document.getElementById('plasticArea').textContent = 
                    `${data.plastic_area_km2?.toFixed(1)} km²`;
                document.getElementById('confidence').textContent = 
                    `${(data.confidence * 100).toFixed(0)}%`;
                document.getElementById('hotspots').textContent = 
                    `${data.hotspots?.length || 0}개`;

                // 핫스팟이 있으면 알림 표시
                if (data.hotspots && data.hotspots.length > 0) {
                    const alertsHtml = data.hotspots.slice(0, 3).map(h => `
                        <div class="bg-red-900/20 border-l-4 border-red-500 p-3 rounded">
                            <p class="font-semibold">오염 지역 감지</p>
                            <p class="text-sm text-gray-400">
                                위치: ${h.lat.toFixed(3)}°N, ${h.lon.toFixed(3)}°E | 
                                강도: ${(h.intensity * 100).toFixed(1)}%
                            </p>
                        </div>
                    `).join('');
                    document.getElementById('alertsList').innerHTML = alertsHtml;
                } else {
                    document.getElementById('alertsList').innerHTML = `
                        <p class="text-green-400">✅ 현재 오염이 감지되지 않았습니다</p>
                    `;
                }

            } catch (error) {
                console.error('Error loading region data:', error);
                
                // 에러 표시
                document.getElementById('status').innerHTML = `
                    <div class="text-red-400">
                        ❌ 데이터 로딩 실패: ${error.message}
                    </div>
                `;

                // 대체 콘텐츠
                document.getElementById('imageContainer').innerHTML = `
                    <div class="text-center">
                        <p class="text-red-400 mb-2">이미지 로딩 실패</p>
                        <p class="text-sm text-gray-500">${error.message}</p>
                    </div>
                `;
            }
        }

        // API 상태 체크
        async function checkAPIStatus() {
            try {
                const response = await fetch(`${API_URL}/`);
                const data = await response.json();
                console.log('API Status:', data);
                
                // 초기 로드 - 남해 데이터
                loadRegion('south_sea');
            } catch (error) {
                console.error('API not available:', error);
                document.getElementById('status').innerHTML = `
                    <div class="text-red-400">
                        ⚠️ API 서버에 연결할 수 없습니다. http://localhost:8001 이 실행중인지 확인하세요.
                    </div>
                `;
            }
        }

        // 페이지 로드시 API 체크
        window.onload = () => {
            console.log('Page loaded, checking API...');
            checkAPIStatus();
        };

        // 30초마다 자동 새로고침 (선택사항)
        // setInterval(() => {
        //     if (currentRegion) {
        //         loadRegion(currentRegion);
        //     }
        // }, 30000);
    </script>
</body>
</html>
