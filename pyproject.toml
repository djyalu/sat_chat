[tool.poetry]
name = "sat-chat"
version = "1.0.0"
description = "SatChat Marine Debris Monitoring"
authors = ["Telefix Team"]
packages = []

[tool.poetry.group.dev]
optional = true

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-dotenv = "^1.0.0"
sentinelhub = "^3.9.1"
numpy = "^1.24.4"
pillow = "^10.1.0"
matplotlib = "^3.7.3"
python-multipart = "^0.0.6"
requests = "^2.31.0"
httpx = "^0.25.1"
scipy = "^1.11.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"