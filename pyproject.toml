[tool.poetry]
name = "satchat"
version = "1.0.0"
description = "Marine Debris Monitoring System"
authors = ["SatChat Team"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-dotenv = "^1.0.0"
python-multipart = "^0.0.6"
requests = "^2.31.0"
sentinelhub = "^3.9.1"
numpy = "^1.24.4"
pillow = "^10.1.0"
matplotlib = "^3.7.3"
httpx = "^0.25.1"
scipy = "^1.11.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
