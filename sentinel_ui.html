<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛰️ SatChat - 실시간 Sentinel-2 해양 모니터링</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <style>
        #map { height: 600px; }
        .leaflet-container { background: #0f172a; }
        .satellite-image { max-width: 100%; height: auto; }
        .heatmap-overlay { position: absolute; top: 0; left: 0; opacity: 0.7; }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .alert-badge {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // API URLs
        const SENTINEL_API = 'http://localhost:8001';
        const MOCK_API = 'http://localhost:8000';
        
        // 한국 해역 정보
        const KOREA_REGIONS = {
            west_sea: { 
                name: '서해', 
                center: [36.0, 125.5],
                color: '#3b82f6'
            },
            south_sea: { 
                name: '남해', 
                center: [33.5, 128.0],
                color: '#10b981'
            },
            east_sea: { 
                name: '동해', 
                center: [37.0, 130.0],
                color: '#8b5cf6'
            }
        };

        // 메인 앱 컴포넌트
        const SatChatApp = () => {
            const [selectedRegion, setSelectedRegion] = useState('south_sea');
            const [regionData, setRegionData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [alerts, setAlerts] = useState([]);
            const [realtimeStats, setRealtimeStats] = useState(null);
            const [timeseriesData, setTimeseriesData] = useState(null);
            const [viewMode, setViewMode] = useState('satellite'); // satellite, heatmap, timeseries
            const [autoRefresh, setAutoRefresh] = useState(false);
            
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const heatLayerRef = useRef(null);
            const chartRef = useRef(null);
            const chartInstanceRef = useRef(null);

            // 지역 데이터 가져오기
            const fetchRegionData = async (region) => {
                setLoading(true);
                try {
                    // Sentinel API에서 실제 데이터 가져오기
                    const response = await fetch(`${SENTINEL_API}/region/${region}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // 받은 데이터로 state 업데이트
                    console.log('Received data:', {
                        region: data.region,
                        hasImage: !!data.image_rgb,
                        imageLength: data.image_rgb ? data.image_rgb.length : 0,
                        plastic: data.plastic_percentage
                    });
                    setRegionData(data);
                    
                    // 히트맵 모드일 때 핫스팟 업데이트
                    if (data.hotspots && data.hotspots.length > 0) {
                        console.log(`Found ${data.hotspots.length} hotspots in ${region}`);
                    }
                    
                    // 알림이 있으면 알림 목록에 추가
                    if (data.alert) {
                        setAlerts(prev => [data.alert, ...prev]);
                    }
                    
                } catch (error) {
                    console.error('Error fetching region data:', error);
                    
                    // 에러 시 기본 데이터 표시
                    const fallbackData = {
                        region: region,
                        region_name: KOREA_REGIONS[region].name,
                        timestamp: new Date().toISOString(),
                        plastic_percentage: 0,
                        plastic_area_km2: 0,
                        hotspots: [],
                        confidence: 0,
                        error: error.message
                    };
                    setRegionData(fallbackData);
                } finally {
                    setLoading(false);
                }
            };

            // 실시간 모니터링 데이터
            const fetchRealtimeMonitoring = async () => {
                try {
                    const response = await fetch(`${SENTINEL_API}/monitoring/realtime`);
                    const data = await response.json();
                    setRealtimeStats(data);
                } catch (error) {
                    console.error('Error fetching realtime monitoring:', error);
                }
            };

            // 시계열 데이터
            const fetchTimeseriesData = async (region) => {
                try {
                    const response = await fetch(`${SENTINEL_API}/timeseries/${region}?days=30`);
                    const data = await response.json();
                    setTimeseriesData(data);
                    updateChart(data);
                } catch (error) {
                    console.error('Error fetching timeseries:', error);
                }
            };

            // 알림 가져오기
            const fetchAlerts = async () => {
                try {
                    const response = await fetch(`${SENTINEL_API}/alerts`);
                    const data = await response.json();
                    setAlerts(data.alerts || []);
                } catch (error) {
                    console.error('Error fetching alerts:', error);
                }
            };

            // 차트 업데이트
            const updateChart = (data) => {
                if (!chartRef.current || !data) return;

                const ctx = chartRef.current.getContext('2d');
                
                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }

                chartInstanceRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.data.map(d => d.date),
                        datasets: [{
                            label: '플라스틱 오염도 (%)',
                            data: data.data.map(d => d.plastic_percentage * 100),
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#fff' }
                            },
                            title: {
                                display: true,
                                text: `${KOREA_REGIONS[selectedRegion].name} 30일 추세`,
                                color: '#fff'
                            }
                        },
                        scales: {
                            x: {
                                ticks: { color: '#94a3b8' },
                                grid: { color: '#1e293b' }
                            },
                            y: {
                                ticks: { color: '#94a3b8' },
                                grid: { color: '#1e293b' }
                            }
                        }
                    }
                });
            };

            // 지도 초기화
            const initMap = () => {
                if (mapInstanceRef.current) return;

                const map = L.map(mapRef.current).setView([36.0, 128.0], 6);
                
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '© OpenStreetMap contributors © CARTO'
                }).addTo(map);

                // 한국 해역 경계 표시
                Object.entries(KOREA_REGIONS).forEach(([key, region]) => {
                    const bounds = key === 'west_sea' ? [[33, 124], [39, 127]] :
                                  key === 'south_sea' ? [[32, 126], [35, 130]] :
                                  [[35, 128], [38.5, 132]];
                    
                    L.rectangle(bounds, {
                        color: region.color,
                        weight: 2,
                        fillOpacity: 0.1
                    }).addTo(map).on('click', () => setSelectedRegion(key));
                });

                mapInstanceRef.current = map;
            };

            // 히트맵 업데이트
            const updateHeatmap = () => {
                if (!mapInstanceRef.current || !regionData) return;

                if (heatLayerRef.current) {
                    mapInstanceRef.current.removeLayer(heatLayerRef.current);
                }

                if (regionData.hotspots && regionData.hotspots.length > 0) {
                    const heatData = regionData.hotspots.map(h => 
                        [h.lat, h.lon, h.intensity]
                    );
                    
                    heatLayerRef.current = L.heatLayer(heatData, {
                        radius: 25,
                        blur: 15,
                        maxZoom: 10
                    }).addTo(mapInstanceRef.current);
                }
            };

            // Effects
            useEffect(() => {
                console.log('Region changed to:', selectedRegion);
                fetchRegionData(selectedRegion);
                fetchTimeseriesData(selectedRegion);
            }, [selectedRegion]);
            
            // Debug regionData changes
            useEffect(() => {
                if (regionData) {
                    console.log('RegionData updated:', {
                        hasData: true,
                        hasImage: !!regionData.image_rgb,
                        imagePreview: regionData.image_rgb ? regionData.image_rgb.substring(0, 50) + '...' : null,
                        viewMode: viewMode
                    });
                }
            }, [regionData, viewMode]);

            useEffect(() => {
                fetchRealtimeMonitoring();
                fetchAlerts();
                
                const interval = setInterval(() => {
                    if (autoRefresh) {
                        fetchRegionData(selectedRegion);
                        fetchRealtimeMonitoring();
                        fetchAlerts();
                    }
                }, 60000); // 1분마다 갱신

                return () => clearInterval(interval);
            }, [selectedRegion, autoRefresh]);

            useEffect(() => {
                if (mapRef.current && !mapInstanceRef.current) {
                    initMap();
                }
            }, []);

            useEffect(() => {
                if (viewMode === 'heatmap') {
                    updateHeatmap();
                }
            }, [viewMode, regionData]);

            return (
                <div className="min-h-screen bg-slate-900">
                    {/* 헤더 */}
                    <header className="bg-slate-800 border-b border-slate-700 p-4">
                        <div className="container mx-auto flex justify-between items-center">
                            <div className="flex items-center space-x-4">
                                <h1 className="text-2xl font-bold flex items-center">
                                    🛰️ SatChat Sentinel-2
                                </h1>
                                <span className="text-sm text-slate-400">
                                    실시간 해양 플라스틱 모니터링
                                </span>
                            </div>
                            <div className="flex items-center space-x-4">
                                <label className="flex items-center space-x-2">
                                    <input
                                        type="checkbox"
                                        checked={autoRefresh}
                                        onChange={(e) => setAutoRefresh(e.target.checked)}
                                        className="rounded"
                                    />
                                    <span className="text-sm">자동 갱신</span>
                                </label>
                                {alerts.length > 0 && (
                                    <div className="alert-badge bg-red-500 text-white px-3 py-1 rounded-full text-sm">
                                        🚨 {alerts.length} 알림
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* 지역 선택 탭 */}
                    <div className="bg-slate-800 border-b border-slate-700">
                        <div className="container mx-auto flex space-x-1 p-2">
                            {Object.entries(KOREA_REGIONS).map(([key, region]) => (
                                <button
                                    key={key}
                                    onClick={() => setSelectedRegion(key)}
                                    className={`px-6 py-2 rounded-t-lg transition-colors ${
                                        selectedRegion === key
                                            ? 'bg-slate-700 text-white'
                                            : 'bg-slate-900 text-slate-400 hover:bg-slate-800'
                                    }`}
                                >
                                    {region.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* 실시간 통계 */}
                    {realtimeStats && (
                        <div className="container mx-auto p-4">
                            <div className="grid grid-cols-4 gap-4 mb-6">
                                <div className="bg-slate-800 rounded-lg p-4">
                                    <div className="text-sm text-slate-400">총 오염도</div>
                                    <div className="text-2xl font-bold text-blue-400">
                                        {(realtimeStats.summary?.total_plastic_percentage * 100 || 0).toFixed(2)}%
                                    </div>
                                </div>
                                <div className="bg-slate-800 rounded-lg p-4">
                                    <div className="text-sm text-slate-400">오염 면적</div>
                                    <div className="text-2xl font-bold text-green-400">
                                        {(realtimeStats.summary?.total_plastic_area_km2 || 0).toFixed(0)} km²
                                    </div>
                                </div>
                                <div className="bg-slate-800 rounded-lg p-4">
                                    <div className="text-sm text-slate-400">모니터링 지역</div>
                                    <div className="text-2xl font-bold text-purple-400">
                                        {realtimeStats.summary?.monitored_regions || 0}개
                                    </div>
                                </div>
                                <div className="bg-slate-800 rounded-lg p-4">
                                    <div className="text-sm text-slate-400">활성 알림</div>
                                    <div className="text-2xl font-bold text-red-400">
                                        {realtimeStats.summary?.alerts_active || 0}건
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 보기 모드 선택 */}
                    <div className="container mx-auto px-4">
                        <div className="flex space-x-2 mb-4">
                            <button
                                onClick={() => setViewMode('satellite')}
                                className={`px-4 py-2 rounded ${
                                    viewMode === 'satellite' 
                                        ? 'bg-blue-600 text-white' 
                                        : 'bg-slate-700 text-slate-300'
                                }`}
                            >
                                🛰️ 위성 이미지
                            </button>
                            <button
                                onClick={() => setViewMode('heatmap')}
                                className={`px-4 py-2 rounded ${
                                    viewMode === 'heatmap' 
                                        ? 'bg-blue-600 text-white' 
                                        : 'bg-slate-700 text-slate-300'
                                }`}
                            >
                                🔥 히트맵
                            </button>
                            <button
                                onClick={() => setViewMode('timeseries')}
                                className={`px-4 py-2 rounded ${
                                    viewMode === 'timeseries' 
                                        ? 'bg-blue-600 text-white' 
                                        : 'bg-slate-700 text-slate-300'
                                }`}
                            >
                                📈 시계열 분석
                            </button>
                        </div>
                    </div>

                    {/* 메인 콘텐츠 */}
                    <div className="container mx-auto p-4">
                        <div className="grid grid-cols-3 gap-6">
                            {/* 지도/이미지 영역 */}
                            <div className="col-span-2">
                                <div className="bg-slate-800 rounded-lg p-4">
                                    <h2 className="text-xl font-bold mb-4">
                                        {KOREA_REGIONS[selectedRegion].name} 실시간 모니터링
                                    </h2>
                                    
                                    {loading ? (
                                        <div className="flex justify-center items-center h-96">
                                            <div className="loading-spinner"></div>
                                        </div>
                                    ) : (
                                        <>
                                            {viewMode === 'satellite' && (
                                                <div className="relative">
                                                    {regionData && regionData.image_rgb ? (
                                                        <div>
                                                            <img 
                                                                src={`data:image/png;base64,${regionData.image_rgb}`}
                                                                alt="Satellite Image"
                                                                className="w-full h-auto rounded"
                                                                style={{ maxHeight: '600px', objectFit: 'contain' }}
                                                                onError={(e) => {
                                                                    console.error('Image load error:', e);
                                                                    e.target.style.display = 'none';
                                                                }}
                                                                onLoad={(e) => {
                                                                    console.log('Image loaded successfully');
                                                                }}
                                                            />
                                                            <div className="absolute top-2 right-2 bg-black bg-opacity-50 text-white px-2 py-1 rounded text-xs">
                                                                Sentinel-2 | {new Date(regionData.timestamp).toLocaleString('ko-KR')}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="bg-slate-700 rounded p-8 text-center" style={{ height: '400px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                                            <div>
                                                                <p className="text-slate-400">위성 이미지를 불러오는 중...</p>
                                                                <p className="text-xs text-slate-500 mt-2">Sentinel-2 데이터 다운로드에 10-30초가 걸릴 수 있습니다</p>
                                                            </div>
                                                        </div>
                                                    )
                                                )}
                                                </div>
                                            )}
                                            
                                            {viewMode === 'heatmap' && (
                                                <div ref={mapRef} id="map" className="rounded"></div>
                                            )}
                                            
                                            {viewMode === 'timeseries' && (
                                                <div className="h-96">
                                                    <canvas ref={chartRef}></canvas>
                                                </div>
                                            )}
                                        </>
                                    )}
                                    
                                    {regionData && (
                                        <div className="mt-4 grid grid-cols-3 gap-4">
                                            <div className="bg-slate-700 rounded p-3">
                                                <div className="text-sm text-slate-400">오염도</div>
                                                <div className="text-xl font-bold">
                                                    {(regionData.plastic_percentage * 100).toFixed(2)}%
                                                </div>
                                            </div>
                                            <div className="bg-slate-700 rounded p-3">
                                                <div className="text-sm text-slate-400">오염 면적</div>
                                                <div className="text-xl font-bold">
                                                    {regionData.plastic_area_km2?.toFixed(1)} km²
                                                </div>
                                            </div>
                                            <div className="bg-slate-700 rounded p-3">
                                                <div className="text-sm text-slate-400">신뢰도</div>
                                                <div className="text-xl font-bold">
                                                    {(regionData.confidence * 100).toFixed(0)}%
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* 알림 패널 */}
                            <div className="col-span-1">
                                <div className="bg-slate-800 rounded-lg p-4">
                                    <h3 className="text-lg font-bold mb-4">🚨 실시간 알림</h3>
                                    <div className="space-y-3 max-h-96 overflow-y-auto">
                                        {alerts.length > 0 ? (
                                            alerts.map((alert, idx) => (
                                                <div
                                                    key={idx}
                                                    className={`p-3 rounded border-l-4 ${
                                                        alert.severity === 'critical' 
                                                            ? 'bg-red-900/20 border-red-500'
                                                            : alert.severity === 'high'
                                                            ? 'bg-orange-900/20 border-orange-500'
                                                            : 'bg-yellow-900/20 border-yellow-500'
                                                    }`}
                                                >
                                                    <div className="text-sm font-semibold">{alert.message}</div>
                                                    <div className="text-xs text-slate-400 mt-1">
                                                        {new Date(alert.timestamp).toLocaleString('ko-KR')}
                                                    </div>
                                                    <div className="text-xs mt-2">
                                                        오염도: {(alert.plastic_percentage * 100).toFixed(1)}% | 
                                                        면적: {alert.estimated_area?.toFixed(0)} km²
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="text-slate-400 text-center py-8">
                                                현재 알림이 없습니다
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* 모니터링 포인트 */}
                                <div className="bg-slate-800 rounded-lg p-4 mt-4">
                                    <h3 className="text-lg font-bold mb-4">📍 모니터링 지점</h3>
                                    <div className="space-y-2">
                                        {regionData?.monitoring_points?.map((point, idx) => (
                                            <div key={idx} className="flex justify-between items-center py-2 border-b border-slate-700">
                                                <span className="text-sm">{point.name}</span>
                                                <span className="text-xs text-slate-400">
                                                    {point.lat.toFixed(2)}°N, {point.lon.toFixed(2)}°E
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 푸터 */}
                    <footer className="bg-slate-800 border-t border-slate-700 p-4 mt-8">
                        <div className="container mx-auto text-center text-sm text-slate-400">
                            <p>🛰️ Sentinel-2 실시간 데이터 | 해상도: 10-60m | 갱신 주기: 5일</p>
                            <p className="mt-2">© 2024 SatChat by Telefix - 한국 해양 플라스틱 모니터링 시스템</p>
                        </div>
                    </footer>
                </div>
            );
        };

        // 앱 렌더링
        ReactDOM.render(<SatChatApp />, document.getElementById('root'));
    </script>
</body>
</html>
