services:
  - type: web
    name: sat-chat-api
    env: python
    buildCommand: pip install -r requirements-enhanced.txt
    startCommand: python enhanced_simple_api.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SENTINEL_HUB_CLIENT_ID
        value: "***REMOVED***"
      - key: SENTINEL_HUB_CLIENT_SECRET
        value: "***REMOVED***"