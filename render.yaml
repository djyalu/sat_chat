services:
  - type: web
    name: satchat-lite
    env: python
    buildCommand: pip install -r requirements-lite.txt
    startCommand: python satchat_lite.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"