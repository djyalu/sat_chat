services:
  - type: web
    name: sat-chat-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn real_sentinel_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SENTINEL_HUB_CLIENT_ID
        sync: false
      - key: SENTINEL_HUB_CLIENT_SECRET
        sync: false
      - key: PORT
        generateValue: true
  
  - type: static
    name: sat-chat-frontend
    buildCommand: echo "Static files ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sat-chat-api.onrender.com/*