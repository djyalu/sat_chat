services:
  - type: web
    name: sat-chat-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python real_sentinel_api.py
    envVars:
      - key: SENTINEL_HUB_CLIENT_ID
        sync: false
      - key: SENTINEL_HUB_CLIENT_SECRET
        sync: false
  
  - type: static
    name: sat-chat-frontend
    buildCommand: echo "Static files ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sat-chat-api.onrender.com/*