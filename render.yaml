services:
  - type: web
    name: sat-chat-api
    runtime: python
    buildCommand: pip install -r requirements_simple.txt
    startCommand: python simple_app.py
    envVars:
      - key: SENTINEL_HUB_CLIENT_ID
        sync: false
      - key: SENTINEL_HUB_CLIENT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"