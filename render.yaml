services:
  - type: web
    name: satchat-client-proxy
    env: python
    buildCommand: pip install -r requirements-minimal.txt
    startCommand: python minimal_proxy_api.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"