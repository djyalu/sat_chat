services:
  - type: web
    name: sat-chat-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn real_sentinel_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SENTINEL_HUB_CLIENT_ID
        sync: false
      - key: SENTINEL_HUB_CLIENT_SECRET
        sync: false